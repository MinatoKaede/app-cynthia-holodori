# 갤산기(doricalc.cc) 번들이 바뀌면 앱용 데이터를 추출해 GitHub Pages에 공개한다.
# - 3시간마다 index.html의 app.js 해시를 공개본 manifest.json의 bundleHash와 비교, 같으면 종료
# - 검증 실패 시 deploy까지 가지 않으므로 이전 공개본이 유지되고, 워크플로는 실패로 끝나 메일 알림이 간다
name: extract

on:
  schedule:
    - cron: '17 */3 * * *' # 정각 혼잡을 피해 17분
  workflow_dispatch:
    inputs:
      force:
        description: '해시가 같아도 다시 추출'
        type: boolean
        default: false

permissions:
  contents: read
  pages: write
  id-token: write
  actions: write # keepalive (워크플로 재활성화)

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.cmp.outputs.changed }}
      hash: ${{ steps.cmp.outputs.hash }}
      pages_url: ${{ steps.pages.outputs.base_url }}
    steps:
      - id: pages
        uses: actions/configure-pages@v5

      - id: cmp
        name: 번들 해시 비교
        env:
          PAGES_URL: ${{ steps.pages.outputs.base_url }}
          FORCE: ${{ inputs.force }}
        run: |
          hash=$(curl -fsSL --retry 3 https://doricalc.cc/ | grep -oE 'app\.js\?v=[0-9a-f]+' | head -1 | cut -d= -f2)
          if [ -z "$hash" ]; then echo "::error::index.html에서 app.js 해시를 찾지 못함 — 갤산기 구조 변경 확인 필요"; exit 1; fi
          published=$( (curl -fsSL "$PAGES_URL/manifest.json" | jq -r '.source.bundleHash // empty') || true)
          echo "현재 번들: $hash / 공개본: ${published:-없음}"
          echo "hash=$hash" >> "$GITHUB_OUTPUT"
          if [ "$hash" != "$published" ] || [ "$FORCE" = "true" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      # 공개 저장소는 60일간 활동이 없으면 예약 실행이 꺼지므로 매번 다시 활성화해 둔다
      - name: keepalive
        if: github.event_name == 'schedule'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X PUT "repos/$GITHUB_REPOSITORY/actions/workflows/extract.yml/enable"

  build:
    needs: check
    if: needs.check.outputs.changed == 'true'
    runs-on: ubuntu-latest
    env:
      HASH: ${{ needs.check.outputs.hash }}
      PAGES_URL: ${{ needs.check.outputs.pages_url }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: tools/package-lock.json

      - run: npm ci
        working-directory: tools

      - name: app.js 다운로드
        run: curl -fsSL --retry 3 -o "$RUNNER_TEMP/app.js" "https://doricalc.cc/assets/app.js?v=$HASH"

      - name: 이전 공개본 manifest
        run: curl -fsSL -o "$RUNNER_TEMP/prev-manifest.json" "$PAGES_URL/manifest.json" || echo "이전 공개본 없음"

      - name: 추출
        working-directory: tools
        run: node --max-old-space-size=4096 extract.mjs "$RUNNER_TEMP/app.js" ../site "$HASH"

      - name: 검증
        working-directory: tools
        run: node validate.mjs ../site "$RUNNER_TEMP/prev-manifest.json"

      - uses: actions/upload-pages-artifact@v4
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
